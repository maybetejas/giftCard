<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Anniversary Story</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <audio id="bg-music" src="song.mp3" preload="auto"></audio>

  <main class="app">
    <section id="start-screen" class="start-screen">
      <button id="start-button" class="start-button" type="button" aria-label="Open gift">
        <span class="gift" aria-hidden="true">🎁</span>
        <span class="start-text">open me 💝</span>
      </button>
    </section>

    <section id="story-screen" class="story-screen hidden" aria-live="polite">
      <div id="slide" class="slide">
        <img id="slide-image" class="slide-image hidden" alt="" />
        <p id="slide-text" class="slide-text"></p>
      </div>
      <div id="final-effects" class="final-effects hidden" aria-hidden="true"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
